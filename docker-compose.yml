services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
      POSTGRES_DB: ${POSTGRES_DB:-chronoflow}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronoflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-chronoflow}:${POSTGRES_PASSWORD:-change_me_before_deploy}@postgres:5432/${POSTGRES_DB:-chronoflow}
      DATA_DIR: /app/data
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data

volumes:
  pg_data:
