services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ontrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_before_deploy}
      POSTGRES_DB: ${POSTGRES_DB:-ontrack}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ontrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEMO_MODE: ${DEMO_MODE:-false}
      SESSION_SECRET: ${SESSION_SECRET:-change_this_session_secret_in_production}
      DATABASE_URL: postgres://${POSTGRES_USER:-ontrack}:${POSTGRES_PASSWORD:-change_me_before_deploy}@postgres:5432/${POSTGRES_DB:-ontrack}
      DATA_DIR: /app/data
      APP_URL: ${APP_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./data:/app/data

volumes:
  pg_data:
